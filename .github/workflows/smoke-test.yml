# Runs one job on an EC2 runner from this stack, to check a deploy end to end.
# Start it from the Actions tab or with `gh workflow run smoke-test.yml`.
name: EC2 runner smoke test

on:
  workflow_dispatch:
    inputs:
      labels:
        description: Runner settings as one label joined with "/", for example cpu=4/spot=false
        default: cpu=2

jobs:
  smoke:
    runs-on: [ec2, "${{ inputs.labels }}"]
    timeout-minutes: 15
    steps:
      - name: Describe the runner
        run: |
          echo "runner: $RUNNER_NAME"
          echo "architecture: $(uname -m), vCPUs: $(nproc)"
          free -g
          df -h /
          echo "cache bucket: $EC2_RUNNER_CACHE_BUCKET, region: $EC2_RUNNER_REGION, NVMe: $EC2_RUNNER_NVME"

      - name: Reach the cache bucket with the instance profile
        run: aws s3 ls "s3://$EC2_RUNNER_CACHE_BUCKET" --region "$EC2_RUNNER_REGION"

      - name: Run a container
        run: docker run --rm hello-world
