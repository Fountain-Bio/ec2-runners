# Checks every push to main and every pull request, on this stack's own EC2
# runners, so a passing run also shows the runners work end to end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [ec2, cpu=2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs vp and Node.js 24, the Lambda runtime's version. vp provides
      # bun at the version in package.json's packageManager field.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Runs cfn-lint for `bun run lint:template`.
      - uses: astral-sh/setup-uv@v10.2.0

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Starts DynamoDB Local in Docker.
      - run: bun run test:integration
      - run: bun run build
      - run: bun run lint:template
