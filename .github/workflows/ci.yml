# Checks every push to main and every pull request on GitHub-hosted runners.
# The stack's own runners take jobs only from private repositories (see
# AllowPublicRepos in template.yaml), so a public repository's CI cannot use
# them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run this workflow, so the token can only read.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the docker-cache action from this checkout. A GitHub-hosted runner
      # has none of the cache variables the stack's boot script sets, so both
      # outputs must be empty, which is what keeps a workflow that uses the
      # action building on GitHub-hosted runners. test/docker-cache.test.ts
      # covers the outputs on a stack runner.
      - id: docker-cache
        uses: ./actions/docker-cache
        with:
          name: ci
      - name: Check the docker-cache outputs are empty
        env:
          CACHE_FROM: ${{ steps.docker-cache.outputs.cache-from }}
          CACHE_TO: ${{ steps.docker-cache.outputs.cache-to }}
        run: |
          [[ -z "$CACHE_FROM" && -z "$CACHE_TO" ]]

      # Installs vp and Node.js 24, the Lambda runtime's version. vp provides
      # bun at the version in package.json's packageManager field.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Runs cfn-lint for `bun run lint:template`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Starts DynamoDB Local in Docker.
      - run: bun run test:integration
      - run: bun run build
      - run: bun run lint:template
