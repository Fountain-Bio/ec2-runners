<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="title desc">
<title id="title">Cost per job: ec2-runners on EC2 Spot against GitHub-hosted runners of the same size</title>
<desc id="desc">2 vCPU x64: ec2-runners 0.12 cents, GitHub-hosted 0.79 cents (6.7 times as much); 4 vCPU x64: ec2-runners 0.42 cents, GitHub-hosted 2.71 cents (6.4 times as much); 8 vCPU x64: ec2-runners 0.68 cents, GitHub-hosted 3.64 cents (5.3 times as much); 16 vCPU x64: ec2-runners 1.07 cents, GitHub-hosted 8.12 cents (7.6 times as much); 16 vCPU arm64: ec2-runners 0.84 cents, GitHub-hosted 4.88 cents (5.8 times as much). Source: docs/benchmarks.md.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.t{font-size:16px;font-weight:600}.s{font-size:12px;fill:#59636e}.l{font-size:13px}.v{font-size:12px;font-variant-numeric:tabular-nums}.k{font-size:12px;fill:#59636e;font-variant-numeric:tabular-nums}.g{stroke:#d1d9e0;stroke-width:1}.b{stroke:#818b98;stroke-width:1}.e{fill:#2a78d6}.h{fill:#eb6834}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.s,.k{fill:#9198a1}.g{stroke:#3d444d}.b{stroke:#656c76}.e{fill:#3987e5}.h{fill:#d95926}}</style>
