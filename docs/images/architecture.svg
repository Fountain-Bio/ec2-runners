<text class="ns" x="105.0" y="122.0" text-anchor="middle">workflow_job webhooks</text>
<rect class="n" x="25" y="220" width="160" height="56" rx="6"/>
<text class="nt" x="105.0" y="245.0" text-anchor="middle">GitHub API</text>
<text class="ns" x="105.0" y="262.0" text-anchor="middle">jobs and runner registration</text>
<rect class="n" x="270" y="80" width="170" height="56" rx="6"/>
<text class="nt" x="355.0" y="105.0" text-anchor="middle">Webhook Lambda</text>
<text class="ns" x="355.0" y="122.0" text-anchor="middle">checks the signature</text>
<rect class="n" x="270" y="220" width="170" height="56" rx="6"/>
<text class="nt" x="355.0" y="245.0" text-anchor="middle">Reconciler Lambda</text>
<text class="ns" x="355.0" y="262.0" text-anchor="middle">matches jobs to runners</text>
<rect class="n" x="270" y="380" width="170" height="56" rx="6"/>
