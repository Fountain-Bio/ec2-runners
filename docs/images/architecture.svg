<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">ec2-runners architecture</title>
<desc id="desc">1. GitHub sends a workflow_job webhook to the Webhook Lambda, which checks its signature. 2. The Webhook Lambda records the queued job in the DynamoDB jobs table and invokes the Reconciler Lambda. 3. The Reconciler confirms with the GitHub API that the job is still queued and registers a just-in-time runner. 4. The Reconciler launches an EC2 Spot instance or a Lambda MicroVM. 5. The runner connects to GitHub, takes a job, runs it, and shuts down. 6. Every 5 minutes the Janitor Lambda terminates idle and overdue runners. EC2 runners share an S3 cache bucket, and the functions send alerts to an SNS topic.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.p{fill:#f6f8fa;stroke:#d1d9e0}.pr{fill:#ddf4ff;stroke:#54aeff}.pl{font-size:13px;font-weight:600;fill:#59636e}.n{fill:#ffffff;stroke:#818b98}.nr{fill:#ffffff;stroke:#2a78d6;stroke-width:1.5}.nt{font-size:13px;font-weight:600;fill:#1f2328}.ns{font-size:11.5px;fill:#59636e}.a{stroke:#59636e;stroke-width:1.5}.ad{stroke:#59636e;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#59636e}.al{font-size:11.5px;fill:#59636e}.sc{fill:#2a78d6}.sn{font-size:11px;font-weight:700;fill:#ffffff}@media (prefers-color-scheme:dark){.p{fill:#151b23;stroke:#3d444d}.pr{fill:#0f2137;stroke:#1f6feb}.pl{fill:#9198a1}.n,.nr{fill:#0d1117}.n{stroke:#656c76}.nr{stroke:#3987e5}.nt{fill:#e6edf3}.ns,.al{fill:#9198a1}.a,.ad{stroke:#9198a1}.ah{fill:#9198a1}.sc{fill:#3987e5}}</style>
