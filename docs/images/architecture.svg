<rect class="n" x="500" y="300" width="170" height="56" rx="6"/>
<text class="nt" x="585.0" y="325.0" text-anchor="middle">SNS alert topic</text>
<text class="ns" x="585.0" y="342.0" text-anchor="middle">to email and chat</text>
