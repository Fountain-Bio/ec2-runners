AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ephemeral GitHub Actions runners on EC2 Spot. A GitHub App webhook records
  queued jobs in a DynamoDB table, and a reconciler launches a fresh instance
  for each job the idle runners cannot cover. Each instance runs one job and
  terminates itself. Includes an S3 bucket for runs-on/cache.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization the GitHub App is installed on.
    Default: example-org
  TriggerLabel:
    Type: String
    Description: Jobs whose runs-on labels include this label get an EC2 runner.
    Default: ec2
  RunnerGroupId:
    Type: Number
    Description: Organization runner group ID. The Default group has ID 1.
    Default: 1
  IdleMinutes:
    Type: Number
    Description: Terminate an instance whose runner has not started a job after this many minutes.
    Default: 20
    MinValue: 5
  MaxMinutes:
    Type: Number
    Description: Hard limit on instance lifetime in minutes. Jobs running longer are killed.
    Default: 360
    MinValue: 10
  AmiOwner:
    Type: String
    Description: Owner account of the runner AMIs. The default is the public RunsOn runner images.
    Default: "135269210855"
  AmiNamePrefix:
    Type: String
    Description: AMI name prefix. The image label is appended, then "-*".
    Default: runs-on-v2.2-
  CpuBaselineFamily:
    Type: String
    Description: >-
      Instance family whose CPU performance is the slowest a runner may get,
      which keeps older types such as i3 and m5d out of attribute-based
      selection. Empty allows any current-generation type.
    Default: m6i
  RunnerVersion:
    Type: String
    Description: >-
      actions/runner version to install when the AMI has none, or "latest".
      2.325.0 or later, the first release with SHA-256 digests on its assets,
      which the boot script checks.
    Default: latest
    AllowedPattern: ^(latest|2\.(32[5-9]|3[3-9][0-9]|[4-9][0-9]{2})\.[0-9]+|[3-9]\.[0-9]+\.[0-9]+)$
    ConstraintDescription: must be "latest" or an actions/runner version of 2.325.0 or later
  CacheRetentionDays:
    Type: Number
    Description: Days to keep objects in the cache bucket.
    Default: 10
  VpcCidr:
    Type: String
    Description: CIDR block for the runner VPC. Split into three public /20 subnets.
    Default: 10.42.0.0/16
  AllowPublicRepos:
    Type: String
    Description: >-
      Launch runners for jobs from public repositories. Fork pull requests in a
      public repository could then write to the cache bucket that every
      repository's jobs read.
    Default: "false"
    AllowedValues: ["true", "false"]
  AlertEmail:
    Type: String
    Description: Email address subscribed to launch alerts. Leave empty to subscribe later.
    Default: ""

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------- Network: public subnets, no NAT, no inbound access ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-a" }]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-b" }]

  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-c" }]

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }
  SubnetCRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetC, RouteTableId: !Ref RouteTable }

  # Keeps cache traffic on the AWS network. Gateway endpoints are free.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTable]

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GitHub Actions runners. Outbound only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  # ---------- Cache ----------
  CacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-cache
            Status: Enabled
            ExpirationInDays: !Ref CacheRetentionDays
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  # ---------- Runner instances ----------
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Allows shell access through Session Manager for debugging a stuck runner.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cache-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub ${CacheBucket.Arn}/*
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt CacheBucket.Arn
        - PolicyName: boot-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BootLogs.Arn

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RunnerRole]

  # Base settings for every runner. The reconciler adds a version per launch
  # carrying the AMI, disk size, tags, and user data.
  RunnerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-runner
      LaunchTemplateData:
        IamInstanceProfile: { Arn: !GetAtt RunnerInstanceProfile.Arn }
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
        InstanceInitiatedShutdownBehavior: terminate
        MetadataOptions:
          HttpTokens: required
          # 2 lets Docker containers in the job reach the instance credentials.
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled

  # ---------- Control plane ----------
  GitHubAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/github-app
      Description: GitHub App credentials. Set appId, privateKey (PEM), and webhookSecret after deploying.
      SecretString: '{"appId":"REPLACE_ME","privateKey":"REPLACE_ME","webhookSecret":"REPLACE_ME"}'

  # Each function has its own role with only the permissions it uses. The
  # webhook is reachable from the internet, so it can only read the secret,
  # record jobs, send alerts, and invoke the reconciler.
  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: webhook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GitHubAppSecret
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReconcilerFunction.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt JobsTable.Arn
              # Alerts about job labels that can never launch.
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  ReconcilerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: reconciler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GitHubAppSecret
              - Effect: Allow
                Action: [ec2:CreateLaunchTemplateVersion, ec2:DeleteLaunchTemplateVersions]
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}
              - Effect: Allow
                Action:
                  - ec2:CreateFleet
                  - ec2:RunInstances
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeSubnets
                  - ec2:GetInstanceTypesFromInstanceRequirements
                Resource: "*"
              # Tags may only be applied while launching. Without this
              # condition the role could add the stack tag to any instance and
              # then terminate it under the janitor's tag-scoped permission.
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [CreateFleet, RunInstances]
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerRole.Arn
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: [spot.amazonaws.com, ec2fleet.amazonaws.com]
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt JobsTable.Arn
              # Terminates spare runners whose job was cancelled before it started.
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ec2-runners:stack: !Ref AWS::StackName
              # Alerts about jobs that cannot launch or keep failing to launch.
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  JanitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: janitor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GitHubAppSecret
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeLaunchTemplateVersions]
                Resource: "*"
              - Effect: Allow
                Action: ec2:DeleteLaunchTemplateVersions
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}
              # Counts idle runners against the job they were launched for.
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ec2-runners:stack: !Ref AWS::StackName

  # Jobs that asked for an EC2 runner, keyed by GitHub job ID. The webhook
  # writes them and the reconciler reads the queued ones. Rows expire after a
  # day through the expiresAt TTL attribute.
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: jobId, AttributeType: N }
      KeySchema:
        - { AttributeName: jobId, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Receives alerts: job labels that can never launch, launches that keep
  # failing, jobs whose runners keep going unused, a runner group that admits
  # public repositories, and the CloudWatch alarms below.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  WebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-webhook
      RetentionInDays: 14
  ReconcilerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-reconciler
      RetentionInDays: 14
  JanitorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-janitor
      RetentionInDays: 14
  # Runner boot logs, uploaded by each instance's boot script when it exits.
  # One stream per runner name.
  BootLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ec2-runners/${AWS::StackName}/boot
      RetentionInDays: 14

  WebhookFunction:
    Type: AWS::Lambda::Function
    DependsOn: WebhookLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-webhook
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.webhook
      Code: ./.build/lambda
      Role: !GetAtt WebhookRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubAppSecret
          GITHUB_ORG: !Ref GitHubOrg
          RUNNER_PREFIX: !Ref AWS::StackName
          TRIGGER_LABEL: !Ref TriggerLabel
          RECONCILER_FUNCTION: !Ref ReconcilerFunction
          JOBS_TABLE: !Ref JobsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ALLOW_PUBLIC_REPOS: !Ref AllowPublicRepos

  WebhookUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt WebhookFunction.Arn
      AuthType: NONE

  # Public function URLs need both permissions. Requests are authenticated
  # inside the function by the GitHub webhook HMAC signature.
  WebhookUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  WebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ReconcilerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReconcilerLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-reconciler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.reconciler
      Code: ./.build/lambda
      Role: !GetAtt ReconcilerRole.Arn
      # A reconcile launches several jobs in parallel, each with up to six EC2
      # Fleet calls (Spot, then On-Demand, in three subnets).
      # Reconciles that overlap wait on a lock item in the jobs table
      # (src/lock.ts), which lapses 30 seconds past this timeout.
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubAppSecret
          GITHUB_ORG: !Ref GitHubOrg
          RUNNER_PREFIX: !Ref AWS::StackName
          TRIGGER_LABEL: !Ref TriggerLabel
          JOBS_TABLE: !Ref JobsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ALLOW_PUBLIC_REPOS: !Ref AllowPublicRepos
          RUNNER_GROUP_ID: !Ref RunnerGroupId
          LAUNCH_TEMPLATE_ID: !Ref RunnerLaunchTemplate
          LAUNCH_TEMPLATE_VERSION: !GetAtt RunnerLaunchTemplate.DefaultVersionNumber
          SUBNET_IDS: !Join [",", [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]]
          CACHE_BUCKET: !Ref CacheBucket
          MAX_MINUTES: !Ref MaxMinutes
          AMI_OWNER: !Ref AmiOwner
          AMI_NAME_PREFIX: !Ref AmiNamePrefix
          RUNNER_VERSION: !Ref RunnerVersion
          BOOT_LOG_GROUP: !Ref BootLogs
          CPU_BASELINE_FAMILY: !Ref CpuBaselineFamily

  ReconcilerAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ReconcilerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 900

  JanitorFunction:
    Type: AWS::Lambda::Function
    DependsOn: JanitorLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-janitor
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.janitor
      Code: ./.build/lambda
      Role: !GetAtt JanitorRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubAppSecret
          GITHUB_ORG: !Ref GitHubOrg
          RUNNER_PREFIX: !Ref AWS::StackName
          JOBS_TABLE: !Ref JobsTable
          IDLE_MINUTES: !Ref IdleMinutes
          MAX_MINUTES: !Ref MaxMinutes
          LAUNCH_TEMPLATE_ID: !Ref RunnerLaunchTemplate

  MaintenanceSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: janitor
          Arn: !GetAtt JanitorFunction.Arn
        # Retries failed launches and replaces runners the janitor terminated.
        - Id: reconciler
          Arn: !GetAtt ReconcilerFunction.Arn

  MaintenanceSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JanitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MaintenanceSchedule.Arn

  ReconcilerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReconcilerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MaintenanceSchedule.Arn

  # ---------- Alarms ----------
  # Each alarm notifies the alert topic when it fires and when it clears.
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-webhook-errors
      AlarmDescription: >-
        The webhook Lambda failed on a GitHub delivery, so that job was not recorded and GitHub does not retry it. Read /aws/lambda/<stack>-webhook, fix the cause, then redeliver from the GitHub App's Advanced tab.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WebhookFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ReconcilerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-reconciler-errors
      AlarmDescription: >-
        A reconcile failed before reaching any job, for example on a GitHub API or DynamoDB error. Queued jobs wait for the next successful run. Read /aws/lambda/<stack>-reconciler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ReconcilerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  JanitorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-janitor-errors
      AlarmDescription: >-
        The janitor failed, so idle and expired runner instances are not being terminated and keep costing money. Read /aws/lambda/<stack>-janitor.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref JanitorFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Counts webhook deliveries rejected for a bad signature. Steady rejections
  # mean the webhook secret in GitHub differs from the one in the app secret.
  InvalidSignatureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebhookLogs
      FilterPattern: '{ $.msg = "rejected delivery with invalid signature" }'
      MetricTransformations:
        - MetricNamespace: !Sub EC2Runners/${AWS::StackName}
          MetricName: InvalidSignatures
          MetricValue: "1"
          DefaultValue: 0

  InvalidSignatureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-webhook-invalid-signatures
      AlarmDescription: >-
        The webhook rejected several deliveries for a bad signature. The webhook
        secret in the GitHub App's settings likely differs from webhookSecret in
        the app secret, so no jobs are being recorded.
      Namespace: !Sub EC2Runners/${AWS::StackName}
      MetricName: InvalidSignatures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  WebhookUrl:
    Description: Set this as the GitHub App webhook URL.
    Value: !GetAtt WebhookUrl.FunctionUrl
  GitHubAppSecretArn:
    Description: Put the GitHub App ID, private key, and webhook secret in this secret.
    Value: !Ref GitHubAppSecret
  CacheBucket:
    Description: S3 bucket used by runs-on/cache and the BuildKit layer cache.
    Value: !Ref CacheBucket
  AlertTopicArn:
    Description: SNS topic for the stack's alerts and alarms. See the README's Alerts section.
    Value: !Ref AlertTopic
